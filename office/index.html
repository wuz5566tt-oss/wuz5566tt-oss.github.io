<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>虛擬辦公室｜公司總控台</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+TC:wght@400;600&family=Inter:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--gold:#d4af37;--gold2:#f5e6a8;--mut:#8a8370;--line:rgba(212,175,55,.22)}
*{box-sizing:border-box;margin:0}html,body{height:100%;background:var(--bg);color:#e9e4d6;font-family:Inter,"Noto Sans TC",sans-serif;overflow:hidden}
a{color:var(--gold2);text-decoration:none}
#c{position:fixed;inset:0}
header{position:fixed;top:0;left:0;right:0;padding:22px 32px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;background:linear-gradient(#0a0a0a,rgba(10,10,10,0))}
header *{pointer-events:auto}
h1{font-family:"Noto Serif TC",serif;font-weight:600;font-size:24px;letter-spacing:.24em;color:var(--gold2)}
h1 small{display:block;font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:.42em;color:var(--gold);font-weight:500;margin-top:4px}
.back{font-size:13px;letter-spacing:.2em;border:1px solid var(--line);padding:8px 16px}
.back:hover{border-color:var(--gold)}
aside{position:fixed;right:24px;top:96px;bottom:24px;width:300px;background:rgba(12,11,8,.82);backdrop-filter:blur(10px);border:1px solid var(--line);padding:22px;overflow:auto}
aside h3{font-family:"Cormorant Garamond",serif;font-weight:500;color:var(--gold);letter-spacing:.32em;font-size:13px;margin:18px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
aside h3:first-child{margin-top:0}
.cnt{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cnt div{border:1px solid var(--line);padding:10px}
.cnt b{display:block;font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:500;color:var(--gold2)}.cnt span{font-size:12px;color:var(--mut);letter-spacing:.1em}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
ul{list-style:none;padding:0}li{font-size:13px;padding:7px 0;border-bottom:1px solid rgba(212,175,55,.08);cursor:pointer;line-height:1.5}li em{font-style:normal;color:var(--mut);display:block;font-size:12px}
.lk a{display:block;font-size:13px;padding:7px 0;letter-spacing:.08em}.lk a:hover{color:#fff}
.gen{font-size:11px;color:var(--mut);margin-top:14px}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;white-space:nowrap;font-size:12px;background:rgba(10,10,10,.8);border:1px solid var(--line);padding:3px 8px;text-align:center}
.tag i{font-style:normal;display:block;font-size:10px;letter-spacing:.12em}
.waiting i{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.2}}
#card{position:fixed;left:32px;bottom:32px;width:320px;background:rgba(12,11,8,.92);border:1px solid var(--gold);padding:20px;display:none}
#card h4{font-family:"Noto Serif TC",serif;color:var(--gold2);font-size:18px;letter-spacing:.1em;margin-bottom:8px}
#card p{font-size:13px;line-height:1.7;color:#cfc8b4}#card .x{position:absolute;right:12px;top:8px;cursor:pointer;color:var(--mut)}
#floors{position:absolute;top:0;left:0}
@media(max-width:760px){header{padding:14px 16px}h1{font-size:18px}aside{left:0;right:0;top:auto;bottom:0;width:auto;height:38vh;border-left:0;border-right:0}#card{left:12px;right:12px;width:auto;bottom:40vh}.back{padding:6px 10px;white-space:nowrap;font-size:12px}h1 small{letter-spacing:.2em}.cnt{grid-template-columns:repeat(4,1fr)}.cnt b{font-size:22px}.cnt div{padding:6px}.tag{font-size:10px;padding:2px 5px}}
</style></head><body>
<canvas id="c"></canvas><div id="tags"></div>
<header><h1>虛擬辦公室<small>VIRTUAL OFFICE · LIVE</small></h1><a class="back" href="../company-dashboard/">← 總控台</a></header>
<aside>
<h3>STATUS 狀態</h3><div class="cnt" id="cnt"></div>
<h3>TODAY 今日任務</h3><ul id="list"></ul>
<h3>REPORTS 戰報</h3><div class="lk">
<a href="https://wuz5566tt-oss.github.io/tw-daily-report/" target="_blank">台股每日多空戰報 · TAIEX</a>
<a href="https://wuz5566tt-oss.github.io/ashare-daily-report/" target="_blank">A股每日多空戰報 · CSI300</a>
<a href="https://wuz5566tt-oss.github.io/nasdaq-daily-report/" target="_blank">美股每日多空戰報 · IXIC</a>
<a href="../company-dashboard/">公司總控台</a></div>
<div class="gen" id="gen"></div></aside>
<div id="card"><span class="x" onclick="card.style.display='none'">✕</span><h4 id="cn"></h4><p id="cb"></p></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const ST={working:['工作中',0xd4af37,'#e8d27a'],idle:['待命',0x55503f,'#8a8370'],waiting:['等老闆決定',0xff9a2e,'#ffae4a'],error:['錯誤',0xe0443a,'#ff6a5e']};
const LINK={tw:'https://wuz5566tt-oss.github.io/tw-daily-report/',us:'https://wuz5566tt-oss.github.io/nasdaq-daily-report/',cn:'https://wuz5566tt-oss.github.io/ashare-daily-report/',gm:'../company-dashboard/',web:'../company-dashboard/'};
const SEAT={gm:[2,0],tw:[1,-1],us:[1,0],cn:[1,1],threads:[0,-.6],web:[0,.6]};
const FL=['內容部 · CONTENT','財經部 · MARKETS','總經理辦公室 · EXECUTIVE'];
const cv=document.getElementById('c'),R=new T.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.toneMapping=T.ACESFilmicToneMapping;
const S=new T.Scene();S.background=new T.Color(0x0a0a0a);S.fog=new T.Fog(0x0a0a0a,26,60);
const mob=innerWidth<760,C=new T.PerspectiveCamera(mob?52:38,1,.1,200);C.position.set(mob?23:18,mob?15:13,mob?27:20);
const O=new OrbitControls(C,cv);O.target.set(mob?0:1.5,mob?1.2:3.6,0);O.enableDamping=true;O.autoRotate=true;O.autoRotateSpeed=.45;O.minDistance=10;O.maxDistance=60;O.maxPolarAngle=1.45;
S.add(new T.HemisphereLight(0x4a4030,0x080706,1.6));const dl=new T.DirectionalLight(0xffe2b0,.6);dl.position.set(8,20,10);S.add(dl);
const M=(c,o={})=>new T.MeshStandardMaterial({color:c,roughness:.75,metalness:.15,...o});
const box=(w,h,d,m,x,y,z,p=S)=>{const b=new T.Mesh(new T.BoxGeometry(w,h,d),m);b.position.set(x,y,z);p.add(b);return b};
const gold=new T.LineBasicMaterial({color:0xd4af37,transparent:true,opacity:.85});
const W=12,D=7,H=3.2;
for(let f=0;f<3;f++){const y=f*H;
 box(W,.18,D,M(0x16140f),0,y,0);
 box(W,H,.12,M(0x110f0b),0,y+H/2,-D/2);box(.12,H,D,M(0x0f0d0a),-W/2,y+H/2,0);
 const e=new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(W,H,D)),gold);e.position.set(0,y+H/2,0);S.add(e);
 const strip=box(W,.04,.04,new T.MeshBasicMaterial({color:0xffc46b}),0,y+.12,D/2);
 const pl=new T.PointLight(0xffb35c,f==2?14:10,10,1.6);pl.position.set(0,y+H-.4,.8);S.add(pl);
 for(let i=-1;i<=1;i++)box(1.4,.03,.4,new T.MeshBasicMaterial({color:0xfff0c8}),i*3.6,y+H-.08,0);
 // floor label sprite
 const cvs=document.createElement('canvas');cvs.width=512;cvs.height=64;const g=cvs.getContext('2d');g.fillStyle='#d4af37';g.font='500 30px "Noto Serif TC",serif';g.fillText(FL[f],8,44);
 const sp=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(cvs),transparent:true}));sp.scale.set(6,.75,1);sp.position.set(-W/2+3.4,y+H-.5,D/2+.05);S.add(sp);
 // plants & shelves
 const pot=box(.4,.5,.4,M(0x2a241a),W/2-.6,y+.35,-D/2+.6);const lf=new T.Mesh(new T.IcosahedronGeometry(.45,0),M(0x2e4a2a,{flatShading:true}));lf.position.set(W/2-.6,y+.95,-D/2+.6);S.add(lf);
 box(2.4,1.8,.4,M(0x1c1912),-W/2+1.6,y+1,-D/2+.3);
}
box(W+.4,.1,D+.4,M(0x1a1710),0,3*H,0);
// city ground
box(80,.05,80,M(0x070707),0,-.15,0);
for(let i=0;i<40;i++){const h=2+Math.random()*12,x=(Math.random()-.5)*70,z=-20-Math.random()*20;box(2+Math.random()*3,h,2+Math.random()*3,M(0x0d0c0a,{emissive:0x1a140a,emissiveIntensity:Math.random()*.6}),x,h/2,z)}
const bots={},pick=[];
function mkBot(id){const [f,s]=SEAT[id];const g=new T.Group();g.position.set(s*3.6,f*H+.09,.2);S.add(g);
 box(2.2,.08,1,M(0x2b2418,{metalness:.4,roughness:.4}),0,.78,0,g);box(.08,.75,.9,M(0x1c1810),-1,.4,0,g);box(.08,.75,.9,M(0x1c1810),1,.4,0,g);
 const mon=new T.MeshStandardMaterial({color:0x111111,emissive:0xd4af37,emissiveIntensity:1});box(.9,.55,.05,mon,0,1.2,-.32,g);box(.06,.25,.06,M(0x222),0,.95,-.32,g);
 box(.6,.08,.6,M(0x1d1a14),0,.5,.75,g);box(.6,.6,.08,M(0x1d1a14),0,.82,1.05,g);
 const body=M(0x3a3226,{flatShading:true}),skin=M(0xd9c3a0,{flatShading:true});
 const tor=new T.Mesh(new T.CylinderGeometry(.2,.26,.6,6),body);tor.position.set(0,.86,.72);g.add(tor);
 const hd=new T.Mesh(new T.IcosahedronGeometry(.2,0),skin);hd.position.set(0,1.32,.7);g.add(hd);
 const halo=new T.Mesh(new T.TorusGeometry(.26,.025,8,32),new T.MeshBasicMaterial({color:0xd4af37,transparent:true}));halo.rotation.x=Math.PI/2;halo.position.set(0,1.66,.7);g.add(halo);
 const lt=new T.PointLight(0xd4af37,2,3);lt.position.set(0,1.3,-.1);g.add(lt);
 [tor,hd].forEach(m=>{m.userData.id=id;pick.push(m)});
 const tg=document.createElement('div');tg.className='tag';tg.onclick=()=>show(id);document.getElementById('tags').appendChild(tg);
 bots[id]={g,mon,halo,lt,hd,tg,d:{id,status:'idle',task:'待命'}};}
Object.keys(SEAT).forEach(mkBot);
const fmt=s=>{try{return new Date(s).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+'（台北）'}catch(e){return s}};
const card=document.getElementById('card');window.card=card;
function show(id){const d=bots[id].d,st=ST[d.status]||ST.idle;document.getElementById('cn').textContent=d.name||id;
 document.getElementById('cb').innerHTML=`<span class="dot" style="background:${st[2]}"></span>${st[0]}<br>任務：${d.task||'—'}<br>最後更新：${fmt(d.updated)}`+(LINK[id]?`<br><a href="${LINK[id]}" target="_blank">開啟報告 →</a>`:'');card.style.display='block'}
function apply(j){const c={working:0,idle:0,waiting:0,error:0},L=document.getElementById('list');L.innerHTML='';
 (j.bots||[]).forEach(d=>{const b=bots[d.id];if(!b)return;b.d=d;const k=ST[d.status]?d.status:'idle';c[k]++;const st=ST[k];
  b.mon.emissive.setHex(st[1]);b.halo.material.color.setHex(st[1]);b.lt.color.setHex(st[1]);
  b.tg.className='tag '+k;b.tg.innerHTML=`${d.name}<i style="color:${st[2]}">● ${st[0]}</i>`;
  const li=document.createElement('li');li.innerHTML=`<span class="dot" style="background:${st[2]}"></span>${d.name}<em>${d.task||'—'} · ${fmt(d.updated)}</em>`;li.onclick=()=>show(d.id);L.appendChild(li)});
 document.getElementById('cnt').innerHTML=Object.keys(c).map(k=>`<div><b style="color:${ST[k][2]}">${c[k]}</b><span>${ST[k][0]}</span></div>`).join('');
 document.getElementById('gen').textContent='資料更新：'+fmt(j.generated)+' · 每 60 秒重新讀取'}
async function poll(){try{const r=await fetch('./status.json?t='+Date.now(),{cache:'no-store'});apply(await r.json())}catch(e){console.warn('status.json',e.message)}}
poll();setInterval(poll,60000);
const rc=new T.Raycaster(),mv=new T.Vector2();let down;
cv.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
cv.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;mv.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);rc.setFromCamera(mv,C);const h=rc.intersectObjects(pick)[0];if(h)show(h.object.userData.id)});
function rs(){R.setSize(innerWidth,innerHeight,false);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const v=new T.Vector3(),clk=new T.Clock();
(function loop(){requestAnimationFrame(loop);const t=clk.getElapsedTime();O.update();
 for(const id in bots){const b=bots[id],s=b.d.status;let k=1;
  if(s==='working')k=.7+.5*Math.sin(t*3);else if(s==='waiting')k=Math.sin(t*6)>0?1.4:.2;else if(s==='idle')k=.25;else if(s==='error')k=1.2;
  b.mon.emissiveIntensity=k;b.lt.intensity=2*k;b.halo.material.opacity=Math.min(1,.3+k*.6);b.halo.rotation.z=t;
  b.hd.position.y=1.32+(s==='working'?Math.sin(t*4+id.length)*.02:0);
  v.copy(b.hd.position);b.g.localToWorld(v);v.y+=.75;v.project(C);
  b.tg.style.display=v.z<1?'block':'none';b.tg.style.left=(v.x+1)/2*innerWidth+'px';b.tg.style.top=(1-v.y)/2*innerHeight+'px'}
 R.render(S,C)})();
</script></body></html>
